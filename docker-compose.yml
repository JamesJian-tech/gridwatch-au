# Single-node Apache Doris (1 FE + 1 BE) for a Linux home server.
# Uses host networking, as in the official quick-start script, so FE/BE register on 127.0.0.1.
#
# Before first start (on the host, once):
#   sudo sysctl -w vm.max_map_count=2000000
#   echo 'vm.max_map_count=2000000' | sudo tee /etc/sysctl.d/99-doris.conf
#   sudo swapoff -a        # Doris BE recommends no swap; optional on a small box
#
# Start:  docker compose up -d      Logs: docker compose logs -f
# Ports:  8030 FE http (web UI + stream load) | 9030 FE MySQL protocol | 8040 BE http
#
# The BE needs an x86-64 CPU with AVX2 (any Intel since Haswell / AMD since Zen).

services:
  fe:
    image: apache/doris:fe-${DORIS_VERSION:-4.1.3}
    container_name: doris-fe
    hostname: fe
    network_mode: host
    environment:
      - FE_SERVERS=fe1:127.0.0.1:9010
      - FE_ID=1
    volumes:
      - ./data/fe/doris-meta:/opt/apache-doris/fe/doris-meta
      - ./data/fe/log:/opt/apache-doris/fe/log
    restart: unless-stopped

  be:
    image: apache/doris:be-${DORIS_VERSION:-4.1.3}
    container_name: doris-be
    hostname: be
    network_mode: host
    environment:
      - FE_SERVERS=fe1:127.0.0.1:9010
      - BE_ADDR=127.0.0.1:9050
    volumes:
      - ./data/be/storage:/opt/apache-doris/be/storage
      - ./data/be/log:/opt/apache-doris/be/log
    depends_on:
      - fe
    restart: unless-stopped
